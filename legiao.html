<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> Caso Legião </title>

    <!-- Ícone da página -->
    <link rel="icon" href="https://static.wikia.nocookie.net/ordemparanormal/images/d/d1/Logo_Ordo_Realitas.png/revision/latest/scale-to-width-down/1000?cb=20221110231728&path-prefix=pt-br">

    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Times New Roman", serif;
        }

        body {
            min-height: 100vh;
            background-image: url("https://static.wikia.nocookie.net/ordemparanormal/images/d/d1/Logo_Ordo_Realitas.png/revision/latest/scale-to-width-down/1000?cb=20221110231728&path-prefix=pt-br");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            background-color: #0b0b0b;
            color: #e0e0e0;
        }

        /* Camada escura para leitura */
        .overlay {
            min-height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 56px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
            color: #b0b0b0;
        }

        /* Área principal */
        main {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Cards / Displays */
        .card {
            background-color: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .card img {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 22px;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .card p {
            font-size: 16px;
            line-height: 1.5;
            color: #cfcfcf;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="overlay">

        <header>
            <h1>Ordo Realitas</h1>
            <p>Organização de Defesa Contra o Paranormal</p>
        </header>

        <main>
            <!-- Card 1 -->
            <div class="card">
                <h2>Dilua Desaparecida</h2>
            <a href="Dilua.html"> Informações que ela deixou para trás. </a>

            </div>

            <!-- Card 2 -->
            <div class="card">
                <h2>Cidade</h2>
            <a href="cidade.html"> Informações sobre Lagoa Mansa. </a>
            </div>


        </main>

        <footer>
            <p>© Ordo Realitas — A verdade espreita onde a razão falha.</p>
        </footer>

    </div>
</body>
</html>

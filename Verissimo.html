<!DOCTYPE html>
<html lang="pt-BR">
<head>
<tittle>Ficha Verissimo</tittle>
<style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Times New Roman", serif;
        }

        body {
            min-height: 100vh;
            background-image: url("https://static.wikia.nocookie.net/ordemparanormal/images/d/d1/Logo_Ordo_Realitas.png/revision/latest/scale-to-width-down/1000?cb=20221110231728&path-prefix=pt-br");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            background-color: #0b0b0b;
            color: #e0e0e0;
        }

        /* Camada escura para leitura */
        .overlay {
            min-height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 56px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
            color: #b0b0b0;
        }

        /* Área principal */
        main {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }



        img {
            max-width: 90%;
            height: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

    </style>
</head>
<body>

    <img src="file:///C:/Users/walti/Downloads/Fichaverissimo.jpeg.jpeg" alt="Ficha de Investigação - Caso de Desaparecimento" width="35%">

</body>
</html>
